name: Market Season Reporter

on:
  schedule:
    # 매일 UTC 11:13, 한국시간 20:13 실행
    - cron: '13 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: |
          pip install -r requirements.txt

      - name: 분석 코드 실행
        env:
          TELE_TOKEN: ${{ secrets.TELE_TOKEN }}
          USER_ID: ${{ secrets.USER_ID }}
        run: |
          python main.py

      - name: 시장 데이터 저장
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add data/*.csv || true
          git commit -m "Update market history" || echo "No changes to commit"
          git push
